name: Build & Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole "Asus ARGB Toggler.py"
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: "dist/Asus ARGB Toggler.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
